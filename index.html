<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blink Brew latte art lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0A4220; --forest-2:#0F5629; --sprout:#7AB929; --sprout-soft:#E7F3D4;
  --latte:#C9914F; --foam:#FFFBF3; --crema:#8B5228; --espresso:#3A2113;
  --bg:#FFFFFF; --surface:#F3F8EC; --ink:#0A2E16; --ink-2:#4A5D4F; --line:#D8E5CC;
  --on-sprout:#0A2E16;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06200F; --surface:#0C2E18; --ink:#EAF4E0; --ink-2:#A9C0AE; --line:#1C4429; --sprout-soft:#163D1F;
  }
}
:root[data-theme="dark"]{
  --bg:#06200F; --surface:#0C2E18; --ink:#EAF4E0; --ink-2:#A9C0AE; --line:#1C4429; --sprout-soft:#163D1F;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sprout);outline-offset:2px;border-radius:10px}

.app{max-width:1080px;margin:0 auto;padding:12px 16px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo-plate{background:#fff;border-radius:14px;padding:8px 12px;display:inline-flex}
.logo-plate img{height:34px;width:auto;display:block}
.top .tag{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);text-align:right;line-height:1.2}

.layout{display:grid;gap:18px}
@media (min-width:860px){.layout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}

/* counter + cup */
.counter{background:var(--forest);border-radius:28px;padding:14px;position:relative;overflow:hidden}
.counter::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 70% at 50% 0%,rgba(122,185,41,.18),transparent 60%);pointer-events:none}
.patterns{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:relative;padding-bottom:2px}
.patterns::-webkit-scrollbar{display:none}
.pat{flex:1 1 0;min-width:0;border:0;background:rgba(255,255,255,.07);color:#EAF4E0;border-radius:16px;padding:8px 10px 7px;text-align:left;cursor:pointer;transition:background .15s}
.pat:hover{background:rgba(255,255,255,.12)}
.pat[aria-pressed="true"]{background:var(--sprout);color:var(--on-sprout)}
.pat b{display:block;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15;white-space:nowrap}
.pat span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;opacity:.85;margin-top:3px;min-height:14px;white-space:nowrap}
.beans{display:inline-flex;gap:2px}
.beans svg{width:14px;height:14px}
.bean{--b:#7AB929;--l:#0A4220}
.bean ellipse{fill:none;stroke:currentColor;opacity:.45}
.bean path{stroke:currentColor;opacity:.45}
.bean.on ellipse{fill:var(--b);stroke:var(--b);opacity:1}
.bean.on path{stroke:var(--l);opacity:1}
.pat[aria-pressed="true"] .bean{--b:#0A4220;--l:#7AB929}

.stage{position:relative;margin:12px auto 4px;width:min(100%,62vh,560px);aspect-ratio:1}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.chip{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(6,32,15,.82);color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.show{opacity:1}
.chip.good{background:var(--sprout);color:var(--on-sprout)}
.hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);color:#EAF4E0;font-weight:700;font-size:14px;background:rgba(6,32,15,.7);padding:6px 12px;border-radius:999px;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.hint.hide{opacity:0}

.milk{display:flex;align-items:center;gap:10px;color:#CFE3BF;font-size:13px;font-weight:700;margin:6px 4px 2px;position:relative}
.milk .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.milk .fill{height:100%;width:100%;background:var(--foam);border-radius:99px;transition:width .1s linear}
.milk.low .fill{background:var(--latte)}
.now-step{position:relative;margin:8px 4px 2px;color:#fff;font-weight:700;font-size:15px;min-height:1.5em}
.now-step b{color:#CFFF71;font-family:var(--display);font-weight:600}
@media (min-width:860px){.now-step{display:none}}
@media (max-width:859px){
  .panel .controls#controls{order:1}
  .result{order:2}
  .intro{order:3}
  .steps,.free-note{order:4}
  .intro h1{font-size:28px}
}

/* panel */
.panel{display:flex;flex-direction:column;gap:16px}
.intro h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.05;margin:4px 0 6px;color:var(--ink);letter-spacing:-.01em}
.intro p{margin:0;color:var(--ink-2);max-width:42ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:2px solid transparent;transition:border-color .15s,background .15s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--line);font-family:var(--display);font-weight:600;color:var(--ink-2)}
.steps li.now{border-color:var(--sprout);background:var(--sprout-soft)}
.steps li.now::before{background:var(--sprout);border-color:var(--sprout);color:var(--on-sprout)}
.steps li.done::before{content:"✓";background:var(--forest);border-color:var(--forest);color:#fff}
.steps .t{font-size:14px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.free-note{padding:12px 14px;border-radius:16px;background:var(--surface);color:var(--ink-2);margin:0}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;gap:8px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--sprout);border-color:var(--sprout);color:var(--on-sprout);margin-left:auto}
.btn.primary:hover{background:#88C93A}
.btn svg{width:18px;height:18px}
.toggle{display:inline-flex;align-items:center;gap:10px;font-weight:800;cursor:pointer;padding:6px 4px;min-height:46px;user-select:none}
.toggle input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked{background:var(--sprout)}
.toggle input:checked::after{transform:translateX(18px)}

/* result sheet */
.result{border-radius:24px;background:var(--surface);padding:18px;display:none;border:2px solid var(--line)}
.result.show{display:block;animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.score-row{display:flex;align-items:center;gap:16px}
.score{flex:none;font-family:var(--display);font-weight:700;font-size:56px;line-height:.9;color:var(--forest);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .score{color:var(--sprout)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .score{color:var(--sprout)}}
.score small{font-size:22px;color:var(--ink-2)}
.verdict{flex:1;min-width:0}
.verdict h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;line-height:1.1}
.verdict p{margin:2px 0 0;color:var(--ink-2);font-size:14px;font-weight:700}
.big-beans{display:flex;gap:4px;margin-top:6px}
.big-beans svg{width:22px;height:22px}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:14px 0 4px;font-size:13px;font-weight:800;color:var(--ink-2)}
.meters .m{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meters .m i{display:block;height:100%;background:var(--sprout);border-radius:99px}
.tips{margin:12px 0 14px;padding:0;list-style:none;display:grid;gap:8px}
.tips li{padding-left:22px;position:relative;font-size:15px}
.tips li::before{content:"";position:absolute;left:4px;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--latte)}
.result .controls .btn.primary{margin-left:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
// Latte foam sim: Lagrangian particles in a source-flow + drag velocity field.
// Cup coords: radius 1, origin center, y down.
const SIM = (() => {
  const P = {
    Qmax: 0.5,      // area per second when still
    s0: 1.5,       // speed at which flow halves
    eps: 0.06,      // source mollifier
    kDrag: 1.15,    // how strongly foam follows a moving stream
    Rd: 0.16,       // drag radius
    a0: 0.00022,    // area per particle
    rs: 0.025,      // emit radius
    G: 128,         // density grid
  };
  function create() {
    return { xs: new Float32Array(14000), ys: new Float32Array(14000), n: 0, fx: 0, fy: 0, vx: 0, vy: 0, has: false, carry: 0, used: 0 };
  }
  function reset(s) { s.n = 0; s.has = false; s.carry = 0; s.used = 0; s.vx = s.vy = 0; }
  // seeded rng so the target is deterministic
  let seed = 1;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function setSeed(v) { seed = v >>> 0; }

  // pouring: bool. (x,y) finger position. dt seconds.
  function step(s, x, y, pouring, dt) {
    if (!s.has) { s.fx = x; s.fy = y; s.vx = 0; s.vy = 0; s.has = true; }
    const ivx = (x - s.fx) / dt, ivy = (y - s.fy) / dt;
    const a = 1 - Math.exp(-dt / 0.05);
    s.vx += (ivx - s.vx) * a; s.vy += (ivy - s.vy) * a;
    s.fx = x; s.fy = y;
    if (!pouring) { s.vx *= 0.5; s.vy *= 0.5; return; }
    const speed = Math.hypot(s.vx, s.vy);
    const sr = speed / P.s0; const Q = P.Qmax / (1 + sr * sr);
    const c = Q / (2 * Math.PI), e2 = P.eps * P.eps, rd2 = P.Rd * P.Rd;
    const dvx = s.vx * P.kDrag, dvy = s.vy * P.kDrag;
    const xs = s.xs, ys = s.ys;
    for (let i = 0; i < s.n; i++) {
      let px = xs[i], py = ys[i];
      const dx = px - x, dy = py - y, d2 = dx * dx + dy * dy;
      let vx = c * dx / (d2 + e2), vy = c * dy / (d2 + e2);
      const g = Math.exp(-d2 / rd2), L = dvx * dy - dvy * dx;
      vx += g * (dvx - 2 * dy * L / rd2); vy += g * (dvy + 2 * dx * L / rd2);
      const r = Math.hypot(px, py);
      let w = 1;
      if (r > 0.86) { const t = Math.min(1, (r - 0.86) / 0.13); w = 1 - t * t * (3 - 2 * t); }
      px += vx * dt * w; py += vy * dt * w;
      const r2 = Math.hypot(px, py);
      if (r2 > 0.985) { px *= 0.985 / r2; py *= 0.985 / r2; }
      xs[i] = px; ys[i] = py;

const PATTERNS = [

/* ---------- state ---------- */
const $ = id => document.getElementById(id);

let pointer = { down:false, x:0, y:0, id:null };
let strokes = []; // {t0,t1}
let served = false, demo = null, dirty = true, budget = 1;
let simPos = null, lastT = performance.now();
let geo = { size:0, dpr:1, cx:0, cy:0, R:0 };

const FR = 256; // foam render resolution
const foamCv = document.createElement('canvas'); foamCv.width = foamCv.height = FR;
const foamCtx = foamCv.getContext('2d');
const foamImg = foamCtx.createImageData(FR, FR);

let best = {};
try { best = JSON.parse(localStorage.getItem('bb-latte-best') || '{}') || {}; } catch(e) { best = {}; }

/* ---------- target ---------- */
function buildTarget(p){
  if (!p.script) return null;
  const s = SIM.runScript(p.script, 1/60);
  const d = SIM.density(s);
  const ghost = document.createElement('canvas'); ghost.width = ghost.height = FR;
  const edge = document.createElement('canvas'); edge.width = edge.height = FR;
  paintFoam(d, ghost, 'ghost'); paintFoam(d, edge, 'edge');
  const m = mask(d);
  return { d, used:s.used, ghost, edge, mask:m, edges:edges(m), frames: SIM.scriptFrames(p.script, 1/60) };
}

/* ---------- foam rendering ---------- */
function sampleD(d, u, v){
  const G = SIM.P.G, gx = u*G - 0.5, gy = v*G - 0.5;
  const ix = Math.floor(gx), iy = Math.floor(gy);
  if (ix < 0 || iy < 0 || ix >= G-1 || iy >= G-1) return 0;
  const fx = gx-ix, fy = gy-iy, k = iy*G+ix;

const sstep = (a,b,x) => { const t = Math.min(1, Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
function paintFoam(d, cv, mode){
  const c = cv.getContext('2d'), img = mode ? c.createImageData(FR,FR) : foamImg, px = img.data;
  for (let y=0; y<FR; y++){
    const v = (y+.5)/FR;
    for (let x=0; x<FR; x++){
      const u = (x+.5)/FR, i = (y*FR+x)*4;
      const rx = u*2-1, ry = v*2-1;
      if (rx*rx+ry*ry > 1){ px[i+3]=0; continue; }
      const q = sampleD(d,u,v);
      if (mode === 'edge'){
        const a = Math.max(0, 1 - Math.abs(q-0.5)/0.14);
        px[i]=122; px[i+1]=185; px[i+2]=41; px[i+3]=Math.min(1,a*1.6)*255;
      } else if (mode === 'ghost'){
        const a = sstep(0.35,0.6,q);
        px[i]=255; px[i+1]=255; px[i+2]=255; px[i+3]=a*62;
      } else {
        const a = sstep(0.28,0.55,q), w = sstep(0.42,0.8,q);
        // tan fringe blending into microfoam white
        px[i]   = 214 + (255-214)*w;
        px[i+1] = 164 + (250-164)*w;
        px[i+2] = 108 + (240-108)*w;
        px[i+3] = a*255;
      }
    }
  }
  c.putImageData(img,0,0);
}

/* ---------- geometry + static cup ---------- */
function resize(){
  const r = $('stage').getBoundingClientRect();
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const size = Math.round(r.width * dpr);
  if (size === geo.size && dpr === geo.dpr) return;
  canvas.width = canvas.height = size;
  geo = { size, dpr, cx:size/2, cy:size/2, R:size*0.355 };
  bg = drawStatic(size);
  dirty = true;
}
function drawStatic(size){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const c = cv.getContext('2d'), cx = size/2, cy = size/2, R = size*0.355;
  // saucer
  c.save(); c.shadowColor='rgba(0,0,0,.35)'; c.shadowBlur=size*0.04; c.shadowOffsetY=size*0.012;
  c.fillStyle='#F7F3EA'; c.beginPath(); c.arc(cx,cy,size*0.47,0,7); c.fill(); c.restore();
  c.strokeStyle='rgba(10,66,32,.10)'; c.lineWidth=size*0.006; c.beginPath(); c.arc(cx,cy,size*0.43,0,7); c.stroke();
  // handle
  c.save(); c.shadowColor='rgba(0,0,0,.25)'; c.shadowBlur=size*0.015;
  c.fillStyle='#0A4220';
  const hw=size*0.11, hh=size*0.075; roundRect(c, cx+R*1.02, cy-hh/2, hw, hh, hh/2); c.fill(); c.restore();
  c.fillStyle='#F7F3EA'; roundRect(c, cx+R*1.02+hw*0.32, cy-hh*0.18, hw*0.42, hh*0.36, hh*0.18); c.fill();
  // cup body rim
  c.save(); c.shadowColor='rgba(0,0,0,.3)'; c.shadowBlur=size*0.025; c.shadowOffsetY=size*0.006;
  c.fillStyle='#0A4220'; c.beginPath(); c.arc(cx,cy,R*1.13,0,7); c.fill(); c.restore();
  c.fillStyle='#FBF6EA'; c.beginPath(); c.arc(cx,cy,R*1.075,0,7); c.fill();
  // crema
  const g = c.createRadialGradient(cx-R*.2,cy-R*.25,R*.1,cx,cy,R);
  g.addColorStop(0,'#A9682F'); g.addColorStop(.65,'#8B5228'); g.addColorStop(1,'#5E3317');
  c.fillStyle=g; c.beginPath(); c.arc(cx,cy,R,0,7); c.fill();
  // crema speckle
  c.save(); c.beginPath(); c.arc(cx,cy,R,0,7); c.clip();
  let sd = 3; const rr = () => (sd = (sd*16807)%2147483647)/2147483647;
  for (let i=0;i<900;i++){ const a=rr()*6.283, d=Math.sqrt(rr())*R, s=rr()*size*0.004+size*0.001;
    c.fillStyle = rr()<.5 ? 'rgba(201,145,79,.18)' : 'rgba(58,33,19,.16)';
    c.beginPath(); c.arc(cx+Math.cos(a)*d, cy+Math.sin(a)*d, s, 0, 7); c.fill(); }
  // inner lip shadow
  const lip = c.createRadialGradient(cx,cy,R*.86,cx,cy,R);
  lip.addColorStop(0,'rgba(0,0,0,0)'); lip.addColorStop(1,'rgba(30,14,5,.38)');
  c.fillStyle=lip; c.fillRect(cx-R,cy-R,2*R,2*R);
  c.restore();
  return cv;
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* ---------- draw ---------- */
function toPx(x,y){ return [geo.cx + x*geo.R, geo.cy + y*geo.R]; }
function draw(){
  const c = ctx, { size, cx, cy, R, dpr } = geo;
  if (!bg) return;
  c.clearRect(0,0,size,size);
  c.drawImage(bg,0,0);
  c.save(); c.beginPath(); c.arc(cx,cy,R,0,7); c.clip();
  const showGuide = target && $('guide').checked && !served && !demo;
  if (showGuide) c.drawImage(target.ghost, cx-R, cy-R, 2*R, 2*R);
  SIM.density(S, densBuf); paintFoam(densBuf, foamCv, null);
  c.imageSmoothingEnabled = true;
  c.drawImage(foamCv, cx-R, cy-R, 2*R, 2*R);
  if (served && target && $('compare').checked) c.drawImage(target.edge, cx-R, cy-R, 2*R, 2*R);
  c.restore();
  if (showGuide) drawPath(c);
  // stream marker
  const pos = demo ? demo.pos : (pointer.down && !served ? simPos : null);
  if (pos){
    const [x,y] = toPx(pos[0],pos[1]);
    c.fillStyle='rgba(255,251,243,.95)'; c.beginPath(); c.arc(x,y,5*dpr,0,7); c.fill();
    c.strokeStyle='rgba(207,255,113,.9)'; c.lineWidth=2.5*dpr; c.beginPath(); c.arc(x,y,16*dpr,0,7); c.stroke();
  }
}
function drawPath(c){
  const dpr = geo.dpr, done = strokes.length;
  pat.script.strokes.forEach((st, si) => {
    const pts = st.pts, a = pts[0], b = pts[pts.length-1];
    const isHold = Math.hypot(b[1]-a[1], b[2]-a[2]) < 1e-3;
    const active = si === (pointer.down ? done-1 : done) || pat.id==='rosetta';
    const col = active ? 'rgba(207,255,113,.95)' : 'rgba(255,255,255,.45)';
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3*dpr; c.lineCap='round'; c.lineJoin='round';
    const [sx,sy] = toPx(a[1],a[2]);
    if (isHold){
      c.setLineDash([6*dpr,6*dpr]); c.beginPath(); c.arc(sx,sy,22*dpr,0,7); c.stroke(); c.setLineDash([]);
    } else {
      c.setLineDash([2*dpr,8*dpr]); c.beginPath();
      pts.forEach((p,i)=>{ const [x,y]=toPx(p[1],p[2]); i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke(); c.setLineDash([]);
      const p2 = pts[pts.length-2], [ex,ey]=toPx(b[1],b[2]), [qx,qy]=toPx(p2[1],p2[2]);
      const ang = Math.atan2(ey-qy, ex-qx), L = 13*dpr;
      c.beginPath(); c.moveTo(ex,ey); c.lineTo(ex-L*Math.cos(ang-0.5), ey-L*Math.sin(ang-0.5));
      c.lineTo(ex-L*Math.cos(ang+0.5), ey-L*Math.sin(ang+0.5)); c.closePath(); c.fill();
    }
    // numbered start badge
    const off = isHold ? 22*dpr : 0;
    const bx = sx + off*0.75, by = sy - off*0.75;
    c.fillStyle = active ? '#CFFF71' : 'rgba(255,255,255,.75)';
    c.beginPath(); c.arc(bx,by,11*dpr,0,7); c.fill();
    c.fillStyle = '#0A2E16'; c.font = `700 ${13*dpr}px Fredoka, Nunito, sans-serif`;
    c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(si+1), bx, by+0.5*dpr);

}

/* ---------- scoring ---------- */
function mask(d){ const G=SIM.P.G,H=G/2,m=new Float32Array(H*H);
  for(let y=0;y<H;y++)for(let x=0;x<H;x++){let v=0;for(const[a,b]of[[0,0],[1,0],[0,1],[1,1]]){const q=d[(2*y+b)*G+2*x+a];v+=Math.min(1,Math.max(0,(q-0.25)/0.5));}m[y*H+x]=v/4;} return m; }
function edges(m){ const H=Math.sqrt(m.length); let a=new Float32Array(m.length);
  for(let y=1;y<H-1;y++)for(let x=1;x<H-1;x++){const gx=m[y*H+x+1]-m[y*H+x-1],gy=m[(y+1)*H+x]-m[(y-1)*H+x];a[y*H+x]=Math.min(1,Math.hypot(gx,gy));}
  for(let p=0;p<2;p++){const b=new Float32Array(a.length);for(let y=1;y<H-1;y++)for(let x=1;x<H-1;x++){let v=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)v+=a[(y+j)*H+x+i];b[y*H+x]=v/9;}a=b;}

function evaluate(){
  const d = SIM.density(S); const U = mask(d), UE = edges(U);
  const fill = dice(target.mask, U), def = dice(target.edges, UE);
  const comb = 0.35*fill + 0.65*def;
  const score = Math.round(100*Math.min(1, Math.max(0, (comb-0.45)/0.47)));
  const tips = [];
  const st = stats(U), tt = stats(target.mask);
  const need = pat.script.strokes.length;
  if (st.area < 1) tips.push('No foam yet. Touch and hold inside the cup to pour.');
  else {
    if (strokes.length < need) tips.push(`This pattern takes ${need} pours and you made ${strokes.length}. Follow the numbered steps.`);
    else if (strokes.length > need + 1) tips.push(`You made ${strokes.length} pours. Fewer, more confident pours look cleaner.`);
    pat.steps.forEach((sp, i) => {
      const k = strokes[sp.s]; if (!k || tips.length > 2) return;
      const dur = (k.t1 - k.t0)/1000;
      if (sp.hold){
        if (dur < sp.hold*0.7) tips.push(`Step ${i+1}: hold longer. You poured ${dur.toFixed(1)}s, aim for about ${sp.hold.toFixed(1)}s.`);
        else if (dur > sp.hold*1.45) tips.push(`Step ${i+1}: ease off. You poured ${dur.toFixed(1)}s, aim for about ${sp.hold.toFixed(1)}s.`);
      }
      if (sp.pull && pat.id !== 'rosetta' && dur > sp.pull*2.2) tips.push(`Step ${i+1}: swipe faster. A quick pull gives a crisp line.`);
    });
    const ratio = st.area / tt.area;
    if (ratio < 0.72) tips.push('Your art came out small. Pour a little longer to build the base.');
    else if (ratio > 1.35) tips.push('Too much milk. Shorter holds keep the shape tidy.');
    const dx = st.cx - tt.cx, dy = st.cy - tt.cy;
    if (Math.hypot(dx,dy) > 0.12){
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'bottom':'top');
      tips.push(`Your art drifted toward the ${dir}. Start each pour on the guide marks.`);
    }
    if (dice(U, mirror(U)) < 0.8) tips.push('Keep it symmetrical. Pull straight through the middle.');
  }
  if (!tips.length) tips.push(score >= 80 ? 'Clean pour. Try it again with the guide switched off.' : 'Watch the demo once more and match its rhythm.');
  return { score, fill, def, tips: tips.slice(0,3) };
}

/* ---------- UI ---------- */
const beanSvg = on => `<svg class="bean ${on?'on':''}" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="7.5" ry="10" transform="rotate(35 12 12)" stroke-width="2"/><path d="M8.5 6.5c3 2 1 7.5 6.5 11" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const beanCount = s => s >= 80 ? 3 : s >= 60 ? 2 : s >= 35 ? 1 : 0;
function renderPatterns(){

}
function renderSteps(){

  el.hidden = false; $('freeNote').hidden = true;
  {
    const c0 = pointer.down ? strokes.length - 1 : strokes.length;
    let idx = pat.steps.findIndex(sp => sp.s >= c0);
    if (pat.id === 'rosetta') idx = 0;
    const ns = $('nowStep');
    if (served) ns.textContent = '';
    else if (idx < 0) ns.innerHTML = '<b>All steps done.</b> Tap serve it to see your score.';
    else ns.innerHTML = pat.id === 'rosetta' ? `<b>One pour.</b> ${pat.steps[0].text} Then ${pat.steps[1].text.charAt(0).toLowerCase()+pat.steps[1].text.slice(1)}`
      : `<b>Step ${idx+1} of ${pat.steps.length}.</b> ${pat.steps[idx].text}`;
  }
  const cur = strokes.length + (pointer.down ? -1 : 0);
  el.innerHTML = pat.steps.map((sp,i) => {
    let cls = '';
    if (pat.id === 'rosetta') cls = strokes.length ? (pointer.down ? 'now' : 'done') : 'now';
    else cls = served ? 'done' : (sp.s < strokes.length - (pointer.down?1:0) ? 'done' : (sp.s === Math.max(0,cur) || (sp.s === strokes.length && !pointer.down) ? 'now' : ''));
    if (served) cls = 'done';
    const t = sp.hold ? `${sp.hold.toFixed(1)}s` : sp.pull ? 'Quick' : sp.flow ? `${sp.flow.toFixed(1)}s` : '';
    return `<li class="${cls}"><span>${sp.text}</span><span class="t">${t}</span></li>`;
  }).join('');
}
function updateMilk(){
  const left = Math.max(0, 1 - S.used/budget);
  $('milkFill').style.width = (left*100).toFixed(1)+'%';
  $('milkPct').textContent = Math.round(left*100)+'%';
  $('milk').classList.toggle('low', left < 0.2);
}
function setChip(text, good){
  const c = $('chip');
  if (!text){ c.classList.remove('show'); return; }
  c.textContent = text; c.classList.add('show'); c.classList.toggle('good', !!good);
}
function selectPattern(p){
  pat = p; target = buildTarget(p);
  $('patName').textContent = p.name; $('patDesc').textContent = `${p.level}. ${p.desc}`;
  $('demoBtn').disabled = !p.script; $('serveBtn').hidden = !p.script;
  $('guide').closest('label').hidden = !p.script;
  resetCup(); renderPatterns();
}
function resetCup(){
  SIM.reset(S); SIM.setSeed((Math.random()*1e9)|0);
  strokes = []; served = false; demo = null; pointer.down = false; simPos = null;
  budget = target ? target.used*1.6 : 2.4;
  $('result').classList.remove('show');
  $('hint').classList.remove('hide');
  $('hint').textContent = 'Touch and hold to start pouring';
  setChip(null); renderSteps(); updateMilk(); dirty = true;
}
function serve(){
  if (!target || served) return;
  if (pointer.down) endStroke();
  served = true;
  const r = evaluate();
  const prev = best[pat.id];
  const guided = $('guide').checked;
  const isBest = !prev || r.score > prev.score;
  if (isBest) { best[pat.id] = { score:r.score, guided }; saveBest(); }
  $('score').innerHTML = `${r.score}<small>/100</small>`;
  $('verdict').textContent = r.score >= 80 ? 'Café ready' : r.score >= 60 ? 'Nice pour' : r.score >= 35 ? 'Getting there' : 'Keep practicing';
  $('verdictSub').textContent = `${pat.name}, guide ${guided?'on':'off'}${isBest && prev ? '. New best!' : prev ? `. Best ${prev.score}` : ''}`;
  $('bigBeans').innerHTML = [0,1,2].map(i=>beanSvg(i<beanCount(r.score))).join('');
  const sh = Math.round(r.fill*100), df = Math.round(r.def*100);
  $('mShape').style.width = sh+'%'; $('vShape').textContent = sh;
  $('mDef').style.width = df+'%'; $('vDef').textContent = df;
  $('tips').innerHTML = r.tips.map(t=>`<li>${t}</li>`).join('');
  $('result').classList.add('show');
  $('hint').classList.add('hide');
  setChip(null); renderSteps(); renderPatterns(); dirty = true;
  if (window.matchMedia('(max-width:859px)').matches) $('result').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'nearest'});
}

/* ---------- input ---------- */
function cupCoords(e){
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left) * geo.dpr, py = (e.clientY - r.top) * geo.dpr;
  let x = (px - geo.cx)/geo.R, y = (py - geo.cy)/geo.R;
  const d = Math.hypot(x,y); if (d > 0.95){ x *= 0.95/d; y *= 0.95/d; }
  return [x,y, Math.hypot((px-geo.cx)/geo.R,(py-geo.cy)/geo.R)];
}
canvas.addEventListener('pointerdown', e => {
  if (served || demo || pointer.down) return;
  const [x,y,raw] = cupCoords(e);
  if (raw > 1.15) return;
  if (S.used >= budget) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  pointer = { down:true, x, y, id:e.pointerId };
  simPos = [x,y]; S.has = false;
  strokes.push({ t0:performance.now(), t1:0 });
  $('hint').classList.add('hide');
  if (navigator.vibrate) try { navigator.vibrate(8); } catch(_){}
  renderSteps();
});
canvas.addEventListener('pointermove', e => {
  if (!pointer.down || e.pointerId !== pointer.id) return;
  const [x,y] = cupCoords(e); pointer.x = x; pointer.y = y;
});
function endStroke(){
  if (!pointer.down) return;
  pointer.down = false; const k = strokes[strokes.length-1]; if (k) k.t1 = performance.now();
  setChip(null); renderSteps(); dirty = true;
}
['pointerup','pointercancel','lostpointercapture'].forEach(t => canvas.addEventListener(t, e => { if (e.pointerId === pointer.id) endStroke(); }));

/* ---------- demo ---------- */
function startDemo(){
  if (!target) return;
  resetCup();
  demo = { i:0, acc:0, pos:null, prevPour:false };
  $('hint').textContent = 'Watch the pour'; $('hint').classList.remove('hide');
  $('demoBtn').disabled = true; $('serveBtn').disabled = true;
}
function endDemo(){
  demo = null;
  $('demoBtn').disabled = false; $('serveBtn').disabled = false;
  $('hint').textContent = 'Your turn. Touch and hold to pour';
  setTimeout(() => { if (!demo && !strokes.length && !served){ SIM.reset(S); updateMilk(); dirty = true; } }, 900);
}

/* ---------- loop ---------- */
const DT = 1/60;
let acc = 0;
function frame(now){
  const el = Math.min(0.1, (now - lastT)/1000); lastT = now;
  if (demo){
    demo.acc += el;
    while (demo.acc >= DT && demo.i < target.frames.length){
      demo.acc -= DT;
      const f = target.frames[demo.i++];
      if (f[2] && !demo.prevPour) S.has = false;
      if (f[2]) SIM.step(S, f[0], f[1], true, DT);
      demo.prevPour = f[2]; demo.pos = f[2] ? [f[0],f[1]] : null;
    }
    updateMilk(); dirty = true;
    if (demo.i >= target.frames.length){ demo.pos = null; endDemo(); }
  } else if (pointer.down && !served){
    acc += el;
    const n = Math.floor(acc/DT); acc -= n*DT;
    const sx = simPos[0], sy = simPos[1];
    for (let i=1; i<=n; i++){
      const u = i/n, x = sx + (pointer.x-sx)*u, y = sy + (pointer.y-sy)*u;
      SIM.step(S, x, y, true, DT);
      simPos = [x,y];
      if (S.used >= budget) break;
    }
    if (n === 0 && (pointer.x !== sx || pointer.y !== sy)) {} // wait for next tick
    const k = strokes[strokes.length-1], dur = (now - k.t0)/1000;
    const sp = pat.steps.find(s => s.s === strokes.length-1 && s.hold);
    if (sp && $('guide').checked) setChip(`${dur.toFixed(1)}s of ${sp.hold.toFixed(1)}s`, Math.abs(dur-sp.hold) < sp.hold*0.2);
    else setChip(`Pouring ${dur.toFixed(1)}s`);
    updateMilk(); dirty = true;
    if (S.used >= budget){ endStroke(); if (target) serve(); else $('hint').textContent = 'Out of milk. Start over for a fresh cup', $('hint').classList.remove('hide'); }
  } else acc = 0;
  if (dirty){ draw(); dirty = false; }
  requestAnimationFrame(frame);
}

/* ---------- wire up ---------- */
$('patterns').addEventListener('click', e => { const b = e.target.closest('.pat'); if (!b) return; selectPattern(PATTERNS.find(p=>p.id===b.dataset.id)); });
$('resetBtn').addEventListener('click', resetCup);
$('againBtn').addEventListener('click', () => { resetCup(); if (window.matchMedia('(max-width:859px)').matches) $('stage').scrollIntoView({block:'center'}); });
$('nextBtn').addEventListener('click', () => { const i = PATTERNS.indexOf(pat); selectPattern(PATTERNS[(i+1) % (PATTERNS.length-1)] ); });
$('serveBtn').addEventListener('click', serve);
$('demoBtn').addEventListener('click', startDemo);
$('guide').addEventListener('change', () => { dirty = true; });
$('compare').addEventListener('change', () => { dirty = true; });
new ResizeObserver(resize).observe($('stage'));
resize();
selectPattern(PATTERNS[0]);
requestAnimationFrame(frame);
</script>
</body>
</html>
